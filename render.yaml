services:
  - type: web
    name: quantity-measurement-backend
    runtime: java
    region: oregon
    plan: free

    buildCommand: mvn clean package -DskipTests

    # Render sets $PORT automatically
    startCommand: java -jar target/quantity-measurement-app-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod

    healthCheckPath: /actuator/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # ── Set these in Render dashbo		services:
		  - type: web
		    name: quantity-measurement-backend
		    runtime: docker          # ← change this line
		    region: oregon
		    plan: free
		    healthCheckPath: /actuator/health
		    envVars:
		      - key: SPRING_PROFILES_ACTIVE
		        value: prod
		      - key: JWT_SECRET
		        sync: false
		      - key: GOOGLE_CLIENT_ID
		        sync: false
		      - key: GOOGLE_CLIENT_SECRET
		        sync: false
		      - key: CORS_ALLOWED_ORIGINS
		        value: http://localhost:4200ard ───────────────────────────────────────
      - key: JWT_SECRET
        sync: false          # generate with: openssl rand -hex 32

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Update this after your Vercel frontend is deployed
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:4200
